<div class="seccion-contacto">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
    
        <div class="tarjeta-contacto">
          
          
          <div class="cabecera-corporativa">
            <h3>Formulario de Contacto</h3>
          </div>
          
          
          <div class="card-body p-4 p-md-5">
            <p class="texto-principal mb-4 text-center">
              ¿Tienes alguna duda sobre el alquiler de vehículos? Déjanos tus datos y te contactaremos en breve.
            </p>
            
            <form>
             
              <div class="mb-4">
                <label for="nombre" class="form-label etiqueta-formulario">Nombre Completo</label>
                <input type="text" class="form-control input-estilizado" id="nombre" name="nombre" [(ngModel)]="datosContacto.nombre" placeholder="Ej: Juan Pérez">
              </div>
              
             
              <div class="mb-4">
                <label for="telefono" class="form-label etiqueta-formulario">Teléfono de Contacto</label>
                <input type="tel" class="form-control input-estilizado" id="telefono" name="telefono" [(ngModel)]="datosContacto.telefono" placeholder="Ej: 300 123 4567">
              </div>
              
             
              <div class="mb-4">
                <label for="mensaje" class="form-label etiqueta-formulario">Mensaje o Consulta</label>
                <textarea class="form-control input-estilizado" id="mensaje" name="mensaje" [(ngModel)]="datosContacto.mensaje" rows="4" placeholder="Escribe aquí tu duda..."></textarea>
              </div>
              
             
              <div class="d-flex justify-content-between mt-5">
                <button type="button" class="btn btn-limpiar" (click)="limpiarFormulario()">Limpiar datos</button>
                <button type="button" class="btn btn-enviar" (click)="enviarMensaje()">Enviar Mensaje</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
