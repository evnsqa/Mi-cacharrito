<title>Catálogo de Vehículos</title>

<section class="CatalogoV py-5">
  <div class="container-fluid px-4 px-md-5">
    <div class="row g-4 row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5">

      <!--Vehículo 2-->
      <div class="col">
        <div class="tarjetaContV h-100">
          <div class="ContenedorImgV">
            <img src="/recursos/vehiculo 2 - Automovil.png" class="imgV">
          </div>
          <div class="CuerpoTarjetaV">
            <h3 class="tituloV">Toyota Agya</h3>
            <button class="botonE" type="button">EXPLORAR</button>
          </div>
        </div>
      </div>

      <!--Vehículo 3-->
      <div class="col">
        <div class="tarjetaContV h-100">
          <div class="ContenedorImgV">
            <img src="/recursos/vehiculo 3 - Automovil.png" class="imgV">
          </div>
          <div class="CuerpoTarjetaV">
            <h3 class="tituloV">Toyota Yaris</h3>
            <button class="botonE" type="button">EXPLORAR</button>
          </div>
        </div>
      </div>

      <!--Vehículo 4-->
      <div class="col">
        <div class="tarjetaContV h-100">
          <div class="ContenedorImgV">
            <img src="/recursos/vehiculo 4 - Automovil.png" class="imgV">
          </div>
          <div class="CuerpoTarjetaV">
            <h3 class="tituloV">Gr Yaris</h3>
            <button class="botonE" type="button">EXPLORAR</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
